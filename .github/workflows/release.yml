name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Test Before Release
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Cache Swift dependencies
      uses: actions/cache@v3
      with:
        path: |
          pdf22md/.build
          pdf22md/Package.resolved
        key: ${{ runner.os }}-swift-release-${{ hashFiles('pdf22md/Package.swift', 'pdf22md/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-swift-release-
          ${{ runner.os }}-swift-
          
    - name: Run tests
      run: |
        chmod +x scripts/test.sh
        scripts/test.sh --verbose

  build:
    name: Build Release Binaries
    runs-on: macos-latest
    needs: [test]
    
    strategy:
      matrix:
        arch: [x86_64, arm64]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Cache Swift dependencies
      uses: actions/cache@v3
      with:
        path: |
          pdf22md/.build
          pdf22md/Package.resolved
        key: ${{ runner.os }}-swift-release-${{ matrix.arch }}-${{ hashFiles('pdf22md/Package.swift', 'pdf22md/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-swift-release-${{ matrix.arch }}-
          ${{ runner.os }}-swift-release-
          ${{ runner.os }}-swift-
          
    - name: Extract version
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT
        
    - name: Inject version information
      run: |
        chmod +x scripts/inject-version.sh
        scripts/inject-version.sh
        
    - name: Build for ${{ matrix.arch }}
      run: |
        cd pdf22md
        swift build -c release --arch ${{ matrix.arch }}
        
    - name: Create binary artifact
      run: |
        mkdir -p dist
        cp pdf22md/.build/release/pdf22md dist/pdf22md-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}
        chmod +x dist/pdf22md-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}
        
    - name: Generate checksums
      run: |
        cd dist
        shasum -a 256 pdf22md-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }} > pdf22md-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.sha256
        
    - name: Upload binary artifact
      uses: actions/upload-artifact@v3
      with:
        name: pdf22md-macos-${{ matrix.arch }}
        path: |
          dist/pdf22md-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}
          dist/pdf22md-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.sha256
        retention-days: 90

  package:
    name: Create Release Packages
    runs-on: macos-latest
    needs: [build]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Extract version
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT
        
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      
    - name: Prepare release files
      run: |
        mkdir -p dist/release-${{ steps.version.outputs.version }}
        
        # Find and copy binaries
        find . -name "pdf22md-${{ steps.version.outputs.version }}-macos-*" -type f -exec cp {} dist/release-${{ steps.version.outputs.version }}/ \;
        
        # Create universal binary
        X86_BINARY="dist/release-${{ steps.version.outputs.version }}/pdf22md-${{ steps.version.outputs.version }}-macos-x86_64"
        ARM_BINARY="dist/release-${{ steps.version.outputs.version }}/pdf22md-${{ steps.version.outputs.version }}-macos-arm64"
        
        if [ -f "$X86_BINARY" ] && [ -f "$ARM_BINARY" ]; then
          lipo -create "$X86_BINARY" "$ARM_BINARY" -output "dist/release-${{ steps.version.outputs.version }}/pdf22md-${{ steps.version.outputs.version }}-universal"
          chmod +x "dist/release-${{ steps.version.outputs.version }}/pdf22md-${{ steps.version.outputs.version }}-universal"
          shasum -a 256 "dist/release-${{ steps.version.outputs.version }}/pdf22md-${{ steps.version.outputs.version }}-universal" > "dist/release-${{ steps.version.outputs.version }}/pdf22md-${{ steps.version.outputs.version }}-universal.sha256"
        fi
        
        # Copy documentation
        cp README.md dist/release-${{ steps.version.outputs.version }}/
        cp LICENSE dist/release-${{ steps.version.outputs.version }}/
        cp CHANGELOG.md dist/release-${{ steps.version.outputs.version }}/ 2>/dev/null || true
        
    - name: Create install script
      run: |
        cat > "dist/release-${{ steps.version.outputs.version }}/install.sh" << 'EOF'
        #!/bin/bash
        # Installation script for pdf22md
        
        set -e
        
        # Detect architecture
        ARCH=$(uname -m)
        case $ARCH in
            x86_64)
                BINARY="pdf22md-${{ steps.version.outputs.version }}-macos-x86_64"
                ;;
            arm64)
                BINARY="pdf22md-${{ steps.version.outputs.version }}-macos-arm64"
                ;;
            *)
                echo "Unsupported architecture: $ARCH"
                echo "Trying universal binary..."
                BINARY="pdf22md-${{ steps.version.outputs.version }}-universal"
                ;;
        esac
        
        # Check if binary exists
        if [ ! -f "$BINARY" ]; then
            echo "Error: Binary $BINARY not found"
            exit 1
        fi
        
        # Install to /usr/local/bin
        echo "Installing $BINARY to /usr/local/bin/pdf22md"
        sudo cp "$BINARY" /usr/local/bin/pdf22md
        sudo chmod +x /usr/local/bin/pdf22md
        
        echo "Installation complete!"
        echo "You can now use pdf22md from anywhere: pdf22md --help"
        EOF
        
        chmod +x "dist/release-${{ steps.version.outputs.version }}/install.sh"
        
    - name: Inject version and create packages
      run: |
        chmod +x scripts/inject-version.sh
        scripts/inject-version.sh
        
        # Copy the universal binary to the expected location for make dist
        if [ -f "dist/release-${{ steps.version.outputs.version }}/pdf22md-${{ steps.version.outputs.version }}-universal" ]; then
          mkdir -p pdf22md/.build/release
          cp "dist/release-${{ steps.version.outputs.version }}/pdf22md-${{ steps.version.outputs.version }}-universal" pdf22md/.build/release/pdf22md
          chmod +x pdf22md/.build/release/pdf22md
        fi
        
        # Create distribution packages
        make dist
        
    - name: Create release archive
      run: |
        cd dist
        tar -czf "pdf22md-${{ steps.version.outputs.version }}.tar.gz" "release-${{ steps.version.outputs.version }}"
        
    - name: Upload release artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-assets
        path: |
          dist/*.dmg
          dist/*.pkg
          dist/*.tar.gz
          dist/release-${{ steps.version.outputs.version }}/*.sha256
        retention-days: 90

  release:
    name: Create GitHub Release
    runs-on: macos-latest
    needs: [package]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Extract version
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT
        
    - name: Download release artifacts
      uses: actions/download-artifact@v3
      with:
        name: release-assets
        path: release-assets/
        
    - name: Generate release notes
      id: release_notes
      run: |
        VERSION=${{ steps.version.outputs.version }}
        
        # Try to extract release notes from CHANGELOG.md
        if [ -f "CHANGELOG.md" ]; then
          # Extract section for this version
          NOTES=$(awk "/^## \[?${VERSION#v}\]?/,/^## \[?[0-9]/ {if(/^## \[?[0-9]/ && !/^## \[?${VERSION#v}\]?/) exit; print}" CHANGELOG.md | head -n -1)
          
          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION"
          fi
        else
          NOTES="Release $VERSION"
        fi
        
        echo "notes<<EOF" >> $GITHUB_OUTPUT
        echo "$NOTES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        release_name: pdf22md ${{ steps.version.outputs.version }}
        body: |
          ${{ steps.release_notes.outputs.notes }}
          
          ## Installation
          
          ### Using Homebrew (Recommended)
          ```bash
          brew install twardoch/tap/pdf22md
          ```
          
          ### Manual Installation
          1. Download the appropriate binary for your platform
          2. Run the included `install.sh` script
          3. Or manually copy the binary to `/usr/local/bin/pdf22md`
          
          ## Checksums
          
          All binaries include SHA256 checksums for verification.
          
          ## Platform Support
          
          - macOS x86_64 (Intel)
          - macOS arm64 (Apple Silicon)
          - Universal binary (both architectures)
          
        draft: false
        prerelease: false
        
    - name: Upload DMG
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: release-assets/pdf22md-${{ steps.version.outputs.version }}.dmg
        asset_name: pdf22md-${{ steps.version.outputs.version }}.dmg
        asset_content_type: application/x-apple-diskimage
        
    - name: Upload PKG
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: release-assets/pdf22md-${{ steps.version.outputs.version }}.pkg
        asset_name: pdf22md-${{ steps.version.outputs.version }}.pkg
        asset_content_type: application/octet-stream
        
    - name: Upload Archive
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: release-assets/pdf22md-${{ steps.version.outputs.version }}.tar.gz
        asset_name: pdf22md-${{ steps.version.outputs.version }}.tar.gz
        asset_content_type: application/gzip