name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Build (Release)
        working-directory: pdf22md
        run: swift build -c release

      - name: Run Tests
        working-directory: pdf22md
        run: swift test
        continue-on-error: true  # Tests may have issues initially

      - name: Verify binary works
        run: |
          ./pdf22md/.build/release/pdf22md --help
          ./pdf22md/.build/release/pdf22md --version

  example-test:
    runs-on: macos-14
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        working-directory: pdf22md
        run: swift build -c release

      - name: Create test PDF directory
        run: mkdir -p testdata/pdf

      - name: Create minimal test PDF
        run: |
          # Create a simple test PDF for CI
          echo '%PDF-1.4
          1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj
          2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj
          3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R >> endobj
          4 0 obj << /Length 44 >> stream
          BT /F1 12 Tf 100 700 Td (Hello World) Tj ET
          endstream endobj
          xref
          0 5
          0000000000 65535 f
          0000000009 00000 n
          0000000058 00000 n
          0000000115 00000 n
          0000000214 00000 n
          trailer << /Size 5 /Root 1 0 R >>
          startxref
          306
          %%EOF' > testdata/pdf/ci-test.pdf

      - name: Run example.sh (fast method only)
        run: ./example.sh -q -t 30 -m fast
