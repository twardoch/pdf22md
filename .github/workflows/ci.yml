name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Build (Release)
        working-directory: pdf22md
        run: swift build -c release

      - name: Run Tests
        working-directory: pdf22md
        run: swift test

      - name: Verify binary works
        run: |
          ./pdf22md/.build/release/pdf22md --help
          ./pdf22md/.build/release/pdf22md --version
